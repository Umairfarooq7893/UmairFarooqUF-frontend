<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — Umair Farooq</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .admin-header { display: flex; justify-content: space-between; align-items: center; padding: 30px 0; border-bottom: 1px solid var(--border); }
    .admin-header h1 { margin: 0; }
    .admin-section { padding: 40px 0; }
    .admin-item { border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 16px; background: var(--surface); }
    .admin-item-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 12px; }
    .admin-item-head h3 { margin: 0; }
    .admin-meta { font-size: 0.85rem; color: var(--muted); margin-bottom: 12px; background: var(--bg); padding: 8px 12px; border-radius: 6px; display: inline-block; }
    .admin-body { white-space: pre-wrap; font-size: 0.95rem; border-left: 3px solid var(--accent); padding-left: 15px; margin-top: 15px; }
    .btn-delete { background: #a02c2c; padding: 6px 12px; font-size: 0.8rem; }
    .btn-delete:hover { background: #7c2020; }
  </style>
</head>
<body>

  <div class="container">
    <div class="admin-header">
      <h1>Admin Dashboard</h1>
      <button id="logoutBtn" class="btn btn-outline">Log Out</button>
    </div>

    <section class="admin-section">
      <h2>Podcast Bookings</h2>
      <div id="bookingsList">Loading...</div>
    </section>

    <section class="admin-section">
      <h2>Partnerships</h2>
      <div id="partnershipsList">Loading...</div>
    </section>

    <section class="admin-section">
      <h2>Idea Submissions</h2>
      <div id="ideasList">Loading...</div>
    </section>
  </div>

  <script>
    const BACKEND_URL = 'https://umairfarooquf-backend.onrender.com';
    const token = localStorage.getItem('adminToken');

    if (!token) { window.location.href = 'admin-login.html'; }

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('adminToken');
      window.location.href = 'admin-login.html';
    });

    async function fetchData(endpoint, targetId, renderCallback) {
      try {
        const res = await fetch(`${BACKEND_URL}/api/admin/${endpoint}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.status === 401) {
          localStorage.removeItem('adminToken');
          window.location.href = 'admin-login.html';
          return;
        }
        const data = await res.json();
        document.getElementById(targetId).innerHTML = data.length === 0 ? '<p style="color: var(--muted);">No records yet.</p>' : data.map(renderCallback).join('');
      } catch (err) {
        document.getElementById(targetId).innerHTML = '<p style="color: red;">Failed to load data. Is server awake?</p>';
      }
    }

    // 1. Load Bookings
    fetchData('bookings', 'bookingsList', (item) => `
      <div class="admin-item">
        <div class="admin-item-head">
          <h3>${item.name} <span style="font-weight: normal; color: var(--muted);">(${item.designation})</span></h3>
          <button class="btn btn-delete" onclick="deleteRecord('podcast_bookings', ${item.id})">Delete</button>
        </div>
        <div class="admin-meta">
          <strong>Company:</strong> ${item.company || 'N/A'} | 
          <strong>Phone:</strong> ${item.contact_number} | 
          <strong>Location:</strong> ${item.preferred_location} ${item.location_details ? `(${item.location_details})` : ''}
        </div>
        <div class="admin-body">${item.notes || 'No additional notes.'}</div>
      </div>
    `);

    // 2. Load Partnerships
    fetchData('partnerships', 'partnershipsList', (item) => `
      <div class="admin-item">
        <div class="admin-item-head">
          <h3>${item.name} - ${item.company || 'N/A'}</h3>
          <button class="btn btn-delete" onclick="deleteRecord('partnerships', ${item.id})">Delete</button>
        </div>
        <div class="admin-meta">
          <strong>Email:</strong> ${item.email} | 
          <strong>Type:</strong> ${item.partnership_type} ${item.extra_details ? `(${item.extra_details})` : ''}
        </div>
        <div class="admin-body">${item.message}</div>
      </div>
    `);

    // 3. Load Ideas
    fetchData('ideas', 'ideasList', (item) => `
      <div class="admin-item">
        <div class="admin-item-head">
          <h3>${item.title}</h3>
          <button class="btn btn-delete" onclick="deleteRecord('ideas', ${item.id})">Delete</button>
        </div>
        <div class="admin-meta">
          <strong>Category:</strong> ${item.category} | 
          <strong>Submitted by:</strong> ${item.author_name} (${item.author_contact})
        </div>
        <div class="admin-body">
          <strong>Problem:</strong> ${item.problem}\n\n<strong>Solution:</strong> ${item.solution}\n\n<strong>Description:</strong> ${item.description}
        </div>
      </div>
    `);

    // Delete function
    async function deleteRecord(table, id) {
      if (!confirm('Are you sure you want to delete this record?')) return;
      try {
        await fetch(`${BACKEND_URL}/api/admin/${table}/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        window.location.reload();
      } catch (err) {
        alert('Failed to delete. Server might be asleep.');
      }
    }
  </script>
</body>
</html>
